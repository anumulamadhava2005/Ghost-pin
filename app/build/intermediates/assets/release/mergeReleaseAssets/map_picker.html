<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>GhostPin Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        html, body, #map {
            width: 100%;
            height: 100%;
            background-color: #09090B;
            background-image: radial-gradient(#27272A 1px, #09090B 1px);
            background-size: 24px 24px;
            overflow: hidden;
        }
        .leaflet-container {
            background-color: #09090B !important;
        }
        .leaflet-control-zoom {
            display: none !important;
        }
        .leaflet-control-attribution {
            background: rgba(9, 9, 11, 0.8) !important;
            color: #71717A !important;
            font-size: 9px !important;
            padding: 2px 6px !important;
        }
        .leaflet-control-attribution a {
            color: #A1A1AA !important;
            text-decoration: none;
        }
        /* Monochrome dark tile filter for high contrast styling */
        .leaflet-tile {
            filter: brightness(0.7) invert(1) contrast(3) hue-rotate(200deg) saturate(0.1) brightness(0.75);
        }
        .center-crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 6px;
            height: 6px;
            background: #FFFFFF;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1000;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="center-crosshair"></div>

    <script>
        var map;
        var isMoving = false;
        var initialLat = 13.0827;
        var initialLng = 80.2707;
        var initialZoom = 14;

        function initMap(lat, lng, zoom) {
            try {
                if (map) {
                    map.remove();
                }

                initialLat = lat || initialLat;
                initialLng = lng || initialLng;
                initialZoom = zoom || initialZoom;

                map = L.map('map', {
                    center: [initialLat, initialLng],
                    zoom: initialZoom,
                    zoomControl: false,
                    attributionControl: true,
                    fadeAnimation: true,
                    zoomAnimation: true
                });

                // Primary high-reliability tile layer with multiple mirrors
                var tileUrl = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
                L.tileLayer(tileUrl, {
                    maxZoom: 19,
                    attribution: '&copy; OpenStreetMap',
                    crossOrigin: true
                }).addTo(map);

                map.on('movestart', function() {
                    isMoving = true;
                    if (window.AndroidBridge && window.AndroidBridge.onMapMoveStarted) {
                        window.AndroidBridge.onMapMoveStarted();
                    }
                });

                map.on('move', function() {
                    var center = map.getCenter();
                    if (window.AndroidBridge && window.AndroidBridge.onMapMoving) {
                        window.AndroidBridge.onMapMoving(center.lat, center.lng);
                    }
                });

                map.on('moveend', function() {
                    isMoving = false;
                    var center = map.getCenter();
                    if (window.AndroidBridge && window.AndroidBridge.onMapMoveEnded) {
                        window.AndroidBridge.onMapMoveEnded(center.lat, center.lng);
                    }
                });

                if (window.AndroidBridge && window.AndroidBridge.onMapReady) {
                    window.AndroidBridge.onMapReady();
                }
            } catch (e) {
                console.error("Map initialization error: " + e);
            }
        }

        function setCenter(lat, lng, zoom) {
            if (map) {
                map.setView([lat, lng], zoom || map.getZoom());
            }
        }

        function flyToLocation(lat, lng, zoom) {
            if (map) {
                map.flyTo([lat, lng], zoom || 16, {
                    animate: true,
                    duration: 1.0
                });
            }
        }

        function zoomIn() {
            if (map) map.zoomIn();
        }

        function zoomOut() {
            if (map) map.zoomOut();
        }

        window.addEventListener('DOMContentLoaded', function() {
            initMap(initialLat, initialLng, initialZoom);
        });
    </script>
</body>
</html>
